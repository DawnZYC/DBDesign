# Security response headers — OWASP ZAP baseline hardening (2026-07-27).
#
# Included at server scope AND inside every location that defines its own
# add_header, because nginx drops all inherited add_header directives at any
# level that sets one of its own. `always` sends them on error responses too.
#
# Clears ZAP alerts: 10038 (CSP), 10020 (anti-clickjacking, via frame-ancestors
# + X-Frame-Options), 10063 (Permissions-Policy), 10021 (X-Content-Type-Options),
# and the COOP/CORP instances of 90004.

add_header X-Content-Type-Options       "nosniff"      always;
add_header X-Frame-Options              "DENY"         always;
add_header Content-Security-Policy       "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
add_header Permissions-Policy           "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin"  always;
add_header Cross-Origin-Resource-Policy "same-origin"  always;
add_header Referrer-Policy              "no-referrer"  always;

# NOTE: Cross-Origin-Embedder-Policy: require-corp is intentionally NOT set —
# it can block legitimate subresources and the app is same-origin and network-
# isolated. The residual COEP instance of alert 90004 is accepted in
# .zap/rules.tsv with that justification. style-src allows 'unsafe-inline'
# because the charting UI (ECharts) injects inline styles.
