<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#ffffff"/>

  <!-- ================= Title ================= -->
  <text x="620" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Overall Scope using Use Case Diagram</text>

  <!-- ================= System boundary ================= -->
  <rect x="200" y="62" width="640" height="616" rx="14" fill="#ffffff" stroke="#222222" stroke-width="2.5"/>
  <text x="520" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#111">Strata System</text>
  <text x="520" y="117" text-anchor="middle" font-size="11.5" fill="#555">Multi-agent analytics platform for the EcoTEA WP1 energy-model dataset</text>

  <!-- Group: Data Ops -->
  <rect x="216" y="134" width="294" height="462" rx="10" fill="#f3f9f4" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="363" y="159" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">Data Ops &amp; Data Quality</text>

  <g fill="#ffffff" stroke="#2e7d32" stroke-width="1.6">
    <ellipse cx="363" cy="200" rx="133" ry="28"/>
    <ellipse cx="363" cy="268" rx="133" ry="28"/>
    <ellipse cx="363" cy="336" rx="133" ry="28"/>
    <ellipse cx="363" cy="404" rx="133" ry="28"/>
    <ellipse cx="363" cy="472" rx="133" ry="28"/>
    <ellipse cx="363" cy="540" rx="133" ry="28"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#1b1b1b">
    <text x="363" y="197">Convert VT model file</text><text x="363" y="212">to EcoTEA workbook</text>
    <text x="363" y="265">Import EcoTEA workbook</text><text x="363" y="280">into the database</text>
    <text x="363" y="333">Review column mapping</text><text x="363" y="348">&amp; data-quality issues</text>
    <text x="363" y="408">Resolve sector conflicts</text>
    <text x="363" y="469">Browse, filter &amp; inspect</text><text x="363" y="484">technology records</text>
    <text x="363" y="544">Maintain emission factors</text>
  </g>

  <!-- Group: AI Analytics -->
  <rect x="530" y="134" width="294" height="462" rx="10" fill="#f0f5fc" stroke="#1565c0" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="677" y="159" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">AI Analytics</text>

  <g fill="#ffffff" stroke="#1565c0" stroke-width="1.6">
    <ellipse cx="677" cy="234" rx="133" ry="28"/>
    <ellipse cx="677" cy="302" rx="133" ry="28"/>
    <ellipse cx="677" cy="370" rx="133" ry="28"/>
    <ellipse cx="677" cy="438" rx="133" ry="28"/>
    <ellipse cx="677" cy="506" rx="133" ry="28"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#1b1b1b">
    <text x="677" y="231">Ask technology questions</text><text x="677" y="246">in natural language</text>
    <text x="677" y="299">Get AI forecast &amp; domain</text><text x="677" y="314">tool answers</text>
    <text x="677" y="367">Visualise results as</text><text x="677" y="382">interactive charts</text>
    <text x="677" y="435">Trace a data point to its</text><text x="677" y="450">source Excel cell</text>
    <text x="677" y="510">Manage RAG knowledge base</text>
  </g>

  <!-- Internal data stores -->
  <rect x="216" y="612" width="608" height="50" rx="8" fill="#f6f6f8" stroke="#8a8a94" stroke-width="1.2"/>
  <text x="520" y="632" text-anchor="middle" font-size="11.5" font-weight="700" fill="#444">Internal data stores (inside the system boundary)</text>
  <text x="520" y="650" text-anchor="middle" font-size="11.5" fill="#555">PostgreSQL 17 — 15-table technology schema  ·  ChromaDB — persistent vector store</text>

  <!-- ================= Primary actor ================= -->
  <g stroke="#222" stroke-width="2" fill="none">
    <circle cx="105" cy="324" r="11" fill="#fff"/>
    <line x1="105" y1="335" x2="105" y2="358"/>
    <line x1="89" y1="342" x2="121" y2="342"/>
    <line x1="105" y1="358" x2="93" y2="376"/>
    <line x1="105" y1="358" x2="117" y2="376"/>
  </g>
  <text x="105" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#111">User</text>
  <text x="105" y="415" text-anchor="middle" font-size="10.5" fill="#555">(Energy analysts, researchers,</text>
  <text x="105" y="429" text-anchor="middle" font-size="10.5" fill="#555">modellers)</text>
  <line x1="105" y1="342" x2="200" y2="342" stroke="#222" stroke-width="1.6"/>

  <!-- ================= External services ================= -->
  <g stroke="#222" stroke-width="2" fill="none">
    <circle cx="1010" cy="212" r="11" fill="#fff"/>
    <line x1="1010" y1="223" x2="1010" y2="246"/>
    <line x1="994" y1="230" x2="1026" y2="230"/>
    <line x1="1010" y1="246" x2="998" y2="264"/>
    <line x1="1010" y1="246" x2="1022" y2="264"/>
  </g>
  <text x="1010" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#111">LLM Provider</text>
  <text x="1010" y="303" text-anchor="middle" font-size="10.5" fill="#555">(OpenAI / DeepSeek / Qwen /</text>
  <text x="1010" y="317" text-anchor="middle" font-size="10.5" fill="#555">Moonshot / Zhipu / Anthropic)</text>
  <line x1="840" y1="230" x2="988" y2="230" stroke="#222" stroke-width="1.6" stroke-dasharray="7 5"/>

  <g stroke="#222" stroke-width="2" fill="none">
    <circle cx="1010" cy="424" r="11" fill="#fff"/>
    <line x1="1010" y1="435" x2="1010" y2="458"/>
    <line x1="994" y1="442" x2="1026" y2="442"/>
    <line x1="1010" y1="458" x2="998" y2="476"/>
    <line x1="1010" y1="458" x2="1022" y2="476"/>
  </g>
  <text x="1010" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Embedding Provider</text>
  <text x="1010" y="515" text-anchor="middle" font-size="10.5" fill="#555">(local sentence-transformers by</text>
  <text x="1010" y="529" text-anchor="middle" font-size="10.5" fill="#555">default; OpenAI / Qwen optional)</text>
  <line x1="840" y1="442" x2="988" y2="442" stroke="#222" stroke-width="1.6" stroke-dasharray="7 5"/>

  <!-- ================= Legend ================= -->
  <line x1="60" y1="700" x2="1180" y2="700" stroke="#ddd" stroke-width="1"/>

  <rect x="60" y="722" width="46" height="26" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="116" y="733" font-size="10.5" font-weight="700" fill="#333">System boundary:</text>
  <text x="116" y="747" font-size="10.5" fill="#555">everything Strata itself implements.</text>

  <rect x="360" y="722" width="46" height="26" rx="6" fill="#f3f9f4" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="416" y="733" font-size="10.5" font-weight="700" fill="#2e7d32">Data Ops &amp; Data Quality:</text>
  <text x="416" y="747" font-size="10.5" fill="#555">convert, import, align, browse.</text>

  <rect x="660" y="722" width="46" height="26" rx="6" fill="#f0f5fc" stroke="#1565c0" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="716" y="733" font-size="10.5" font-weight="700" fill="#1565c0">AI Analytics:</text>
  <text x="716" y="747" font-size="10.5" fill="#555">chat, tools, charts, traceback, RAG.</text>

  <line x1="960" y1="735" x2="1006" y2="735" stroke="#222" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="1016" y="733" font-size="10.5" font-weight="700" fill="#333">Out of scope / external:</text>
  <text x="1016" y="747" font-size="10.5" fill="#555">third-party services Strata calls.</text>
</svg>
