  <text x="820.0" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#111">2. Analysis Sequence Diagram — UC11 Ask a question in natural language</text>
  <text x="820.0" y="58" text-anchor="middle" font-size="12" fill="#666">The business process: who does what, in the analyst's vocabulary. Objects are domain concepts from diagram 1, not software components.</text>
