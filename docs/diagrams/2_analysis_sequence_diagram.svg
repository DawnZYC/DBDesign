  <text x="155.0" y="154" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">Analyst</text>
  <rect x="261.0" y="84" width="168" height="54" rx="5" fill="#eef4fc" stroke="#1565c0" stroke-width="1.6"/>
  <text x="345.0" y="103" text-anchor="middle" font-size="9.5" font-style="italic" fill="#1565c0">&#171;system&#187;</text>
  <text x="345.0" y="117" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111">:Strata</text>
  <rect x="451.0" y="84" width="168" height="54" rx="5" fill="#fdf1e3" stroke="#c26a13" stroke-width="1.6"/>
  <text x="535.0" y="103" text-anchor="middle" font-size="9.5" font-style="italic" fill="#c26a13">&#171;business capability&#187;</text>
  <text x="535.0" y="117" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111">:Question</text>
  <text x="535.0" y="130" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111">Understanding</text>
  <rect x="641.0" y="84" width="168" height="54" rx="5" fill="#fdf1e3" stroke="#c26a13" stroke-width="1.6"/>
  <text x="725.0" y="103" text-anchor="middle" font-size="9.5" font-style="italic" fill="#c26a13">&#171;business capability&#187;</text>
  <text x="725.0" y="117" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111">:Data</text>
  <text x="725.0" y="130" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111">Retrieval</text>
  <rect x="831.0" y="84" width="168" height="54" rx="5" fill="#fdf1e3" stroke="#c26a13" stroke-width="1.6"/>
  <text x="915.0" y="103" text-anchor="middle" font-size="9.5" font-style="italic" fill="#c26a13">&#171;business capability&#187;</text>
  <text x="915.0" y="117" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111">:Insight</text>
  <text x="915.0" y="130" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111">Generation</text>
  <rect x="1021.0" y="84" width="168" height="54" rx="5" fill="#fdf1e3" stroke="#c26a13" stroke-width="1.6"/>
  <text x="1105.0" y="103" text-anchor="middle" font-size="9.5" font-style="italic" fill="#c26a13">&#171;business capability&#187;</text>
  <text x="1105.0" y="117" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111">:Visualisation</text>
  <rect x="1211.0" y="84" width="168" height="54" rx="5" fill="#f1f8f2" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="1295.0" y="103" text-anchor="middle" font-size="9.5" font-style="italic" fill="#2e7d32">&#171;domain data&#187;</text>
  <text x="1295.0" y="117" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111">:Technology</text>
  <text x="1295.0" y="130" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111">Dataset</text>
  <rect x="1401.0" y="84" width="168" height="54" rx="5" fill="#f1f8f2" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="1485.0" y="103" text-anchor="middle" font-size="9.5" font-style="italic" fill="#2e7d32">&#171;domain data&#187;</text>
  <text x="1485.0" y="117" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111">:Domain</text>
  <text x="1485.0" y="130" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111">Knowledge</text>
  <line x1="155.0" y1="190" x2="345.0" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="250.0" y="183" text-anchor="middle" font-size="10.5" fill="#111">1. ask a question in plain language</text>
  <line x1="345.0" y1="230.0" x2="535.0" y2="230.0" stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="440.0" y="223.0" text-anchor="middle" font-size="10.5" fill="#111">2. work out what is being asked</text>
  <path d="M 535.0,270.0 L 581.0,270.0 L 581.0,294.0 L 541.0,294.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="589.0" y="278.0" text-anchor="start" font-size="10.5" fill="#222">3. classify the Intent and outline the steps</text>
  <line x1="535.0" y1="336.0" x2="345.0" y2="336.0" stroke="#555" stroke-width="1.5" marker-end="url(#openarrow)" stroke-dasharray="7 5"/>
  <text x="440.0" y="329.0" text-anchor="middle" font-size="10.5" fill="#555">4. AnalysisPlan (intent + steps)</text>
  <line x1="345.0" y1="420.0" x2="725.0" y2="420.0" stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="535.0" y="413.0" text-anchor="middle" font-size="10.5" fill="#111">5. obtain the figures the plan calls for</text>
  <path d="M 725.0,460.0 L 771.0,460.0 L 771.0,484.0 L 731.0,484.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="779.0" y="468.0" text-anchor="start" font-size="10.5" fill="#222">6. express the plan as a QuerySpecification</text>
  <line x1="725.0" y1="526.0" x2="1295.0" y2="526.0" stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="1010.0" y="519.0" text-anchor="middle" font-size="10.5" fill="#111">7. select DataPoints for metric, filters and years</text>
  <line x1="1295.0" y1="566.0" x2="725.0" y2="566.0" stroke="#555" stroke-width="1.5" marker-end="url(#openarrow)" stroke-dasharray="7 5"/>
  <text x="1010.0" y="559.0" text-anchor="middle" font-size="10.5" fill="#555">8. AnswerSet (DataPoint + SourceCell)</text>
  <line x1="725.0" y1="606.0" x2="345.0" y2="606.0" stroke="#555" stroke-width="1.5" marker-end="url(#openarrow)" stroke-dasharray="7 5"/>
  <text x="535.0" y="599.0" text-anchor="middle" font-size="10.5" fill="#555">9. AnswerSet</text>
  <line x1="345.0" y1="690.0" x2="535.0" y2="690.0" stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="440.0" y="683.0" text-anchor="middle" font-size="10.5" fill="#111">10. revise the plan and try again</text>
  <line x1="345.0" y1="774.0" x2="1485.0" y2="774.0" stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="915.0" y="767.0" text-anchor="middle" font-size="10.5" fill="#111">11. look up a term, convert a unit or project a trend</text>
  <line x1="1485.0" y1="814.0" x2="345.0" y2="814.0" stroke="#555" stroke-width="1.5" marker-end="url(#openarrow)" stroke-dasharray="7 5"/>
  <text x="915.0" y="807.0" text-anchor="middle" font-size="10.5" fill="#555">12. factual answer with its source</text>
  <line x1="345.0" y1="916.0" x2="915.0" y2="916.0" stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="630.0" y="909.0" text-anchor="middle" font-size="10.5" fill="#111">13. explain what these figures mean</text>
  <line x1="915.0" y1="956.0" x2="345.0" y2="956.0" stroke="#555" stroke-width="1.5" marker-end="url(#openarrow)" stroke-dasharray="7 5"/>
  <text x="630.0" y="949.0" text-anchor="middle" font-size="10.5" fill="#555">14. Insight (narrative)</text>
  <line x1="345.0" y1="996.0" x2="155.0" y2="996.0" stroke="#555" stroke-width="1.5" marker-end="url(#openarrow)" stroke-dasharray="7 5"/>
  <text x="250.0" y="989.0" text-anchor="middle" font-size="10.5" fill="#555">15. present the narrative as it is composed</text>
  <line x1="345.0" y1="1098.0" x2="1105.0" y2="1098.0" stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="725.0" y="1091.0" text-anchor="middle" font-size="10.5" fill="#111">16. decide how this AnswerSet is best shown</text>
  <line x1="1105.0" y1="1138.0" x2="345.0" y2="1138.0" stroke="#555" stroke-width="1.5" marker-end="url(#openarrow)" stroke-dasharray="7 5"/>
  <text x="725.0" y="1131.0" text-anchor="middle" font-size="10.5" fill="#555">17. Chart (type + series)</text>
  <line x1="345.0" y1="1178.0" x2="155.0" y2="1178.0" stroke="#555" stroke-width="1.5" marker-end="url(#openarrow)" stroke-dasharray="7 5"/>
  <text x="250.0" y="1171.0" text-anchor="middle" font-size="10.5" fill="#555">18. present the Chart</text>
  <line x1="155.0" y1="1280.0" x2="345.0" y2="1280.0" stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="250.0" y="1273.0" text-anchor="middle" font-size="10.5" fill="#111">19. question a value in the chart</text>
  <line x1="345.0" y1="1320.0" x2="1295.0" y2="1320.0" stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="820.0" y="1313.0" text-anchor="middle" font-size="10.5" fill="#111">20. where did this DataPoint come from?</text>
  <line x1="1295.0" y1="1360.0" x2="345.0" y2="1360.0" stroke="#555" stroke-width="1.5" marker-end="url(#openarrow)" stroke-dasharray="7 5"/>
  <text x="820.0" y="1353.0" text-anchor="middle" font-size="10.5" fill="#555">21. SourceCell (workbook, sheet, row)</text>
  <line x1="345.0" y1="1400.0" x2="155.0" y2="1400.0" stroke="#555" stroke-width="1.5" marker-end="url(#openarrow)" stroke-dasharray="7 5"/>
  <text x="250.0" y="1393.0" text-anchor="middle" font-size="10.5" fill="#555">22. show the originating spreadsheet cell</text>
  <path d="M 375.0,1426.0 L 948.5999999999999,1426.0 L 960.5999999999999,1438.0 L 960.5999999999999,1473.0 L 375.0,1473.0 z" fill="#fffbe6" stroke="#d4b106" stroke-width="1.1"/>
  <path d="M 948.5999999999999,1426.0 L 948.5999999999999,1438.0 L 960.5999999999999,1438.0" fill="none" stroke="#d4b106" stroke-width="1.1"/>
  <text x="383.0" y="1442.0" font-size="9.5" fill="#6b5900">Business flow only. :Strata is still a black box -- there is no HTTP, no streaming protocol, no agent</text>
  <text x="383.0" y="1455.0" font-size="9.5" fill="#6b5900">framework and no database here. The four business capabilities are responsibilities, not software</text>
  <text x="383.0" y="1468.0" font-size="9.5" fill="#6b5900">classes; diagram 3 shows which concrete classes take them on.</text>
  <path d="M 937.0,580.0 L 1208.2,580.0 L 1220.2,592.0 L 1220.2,614.0 L 937.0,614.0 z" fill="#fffbe6" stroke="#d4b106" stroke-width="1.1"/>
  <path d="M 1208.2,580.0 L 1208.2,592.0 L 1220.2,592.0" fill="none" stroke="#d4b106" stroke-width="1.1"/>
  <text x="945.0" y="596.0" font-size="9.5" fill="#6b5900">Every DataPoint arrives with its SourceCell,</text>
  <text x="945.0" y="609.0" font-size="9.5" fill="#6b5900">which is what makes step 19-21 possible at all.</text>
  <line x1="40" y1="1520.0" x2="1600" y2="1520.0" stroke="#ddd"/>
  <text x="50.0" y="1540.0" font-size="10" font-weight="700" fill="#333">system</text>
  <text x="50.0" y="1554.0" font-size="9.5" fill="#666">the platform seen as one black box</text>
  <text x="430.0" y="1540.0" font-size="10" font-weight="700" fill="#333">business capability</text>
  <text x="430.0" y="1554.0" font-size="9.5" fill="#666">a responsibility the business needs performed</text>
  <text x="810.0" y="1540.0" font-size="10" font-weight="700" fill="#333">domain data</text>
  <text x="810.0" y="1554.0" font-size="9.5" fill="#666">the information the business owns</text>
  <text x="1190.0" y="1540.0" font-size="10" font-weight="700" fill="#333">alt / opt / loop</text>
  <text x="1190.0" y="1554.0" font-size="9.5" fill="#666">UML combined fragments</text>
