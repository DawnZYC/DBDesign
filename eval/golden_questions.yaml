# Golden questions for the SG-TIMES multi-agent platform (M3/M6).
#
# Each item:
#   id:                  stable identifier
#   question:            what the user types into the chat
#   category:            sql | terminology | unit_convert | emission | forecast | chart | multi
#   expected_keywords:   ALL must appear (case-insensitive) in the final answer text
#   expected_tools:      tools that should appear in tool_call events (subset match)
#   expected_chart_type: line | bar | pie | sankey | none  (chart event's series type;
#                        "none" means no chart event is required)
#
# Run with:  python eval/runner.py --base-url http://localhost:8000
# Data assumptions: the EcoTEA Endo WP1 template has been imported and
# seed_commodities.py / seed_rag.py have been run.

- id: q01_capex_power_total
